x-common-environment: &common-environment
  # 基础配置
  ENV: dev
  TZ: Asia/Shanghai
  DATA_DIR: /data
  
  # 数据库配置
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fast_voice
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT_SECONDS: "30"
  DB_POOL_RECYCLE_SECONDS: "1800"
  
  # Redis 配置
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  
  # JWT 配置
  JWT_SECRET: f77a006515c2020c609f248b31c56a09
  JWT_ISSUER: fast-voice
  JWT_ACCESS_TOKEN_MINUTES: 1440


  # 业务配置
  CREDIT_PRICE_PER_UTF8_BYTE: 1   # 每字符消耗的积分数
  MAX_TEXT_UTF8_BYTES: 4000       # TTS的最大字符数限制
  ADMIN_EMAIL: admin@autogame.ai    # 管理员账号
  ADMIN_PASSWORD: Nank$$CA#RKdU78tt   # 管理员密码

  # 音频文件上传限制
  MAX_AUDIO_FILE_SIZE_MB: 32
  MAX_AUDIO_FILE_SIZE_BYTES: 33554432
  
  # 测试邀请码
  TEST_INVITE_CODE: autogame-fast-voice
  
  # 外部服务配置
  VOICE_SVC_BASE_URL: http://192.168.1.5:4000
  VOICE_TTS_BASE_URL: http://192.168.1.5:7000

services:
  api:
    image: harbor.autogame.ai/backend/fast-voice:${IMAGE_TAG:-dev_latest}
    container_name: fast-voice-api
    environment:
      <<: *common-environment
      AUTO_CREATE_DB: "true"
      ADMIN_BOOTSTRAP: "true"
    volumes:
      - ./data:/data
    ports:
      - "8123:8000"
    depends_on:
      - db
      - redis
  worker:
    image: harbor.autogame.ai/backend/fast-voice:${IMAGE_TAG:-dev_latest}
    container_name: fast-voice-worker
    command: ["uv", "run", "celery", "-A", "app.tasks.celery_app:celery_app", "worker", "-l", "DEBUG", "-Q", "tts,clone"]
    environment:
      <<: *common-environment
      AUTO_CREATE_DB: "false"
      ADMIN_BOOTSTRAP: "false"
    volumes:
      - ./data:/data
    depends_on:
      - db
      - redis
  db:
    image: postgres:16
    container_name: fast-voice-pg
    ports:
      - "5454:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: fast_voice
      TZ: Asia/Shanghai
    volumes:
      - fast_voice_db:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: fast-voice-redis
#    ports:
#      - "6381:6379"

volumes:
  fast_voice_db:


