[project]
name = "fast-voice"
version = "0.1.0"
description = "Fast Voice: OpenAI-style console + OpenAPI gateway for TTS/voice cloning (V1)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "asyncpg==0.30.0",
  "aiosqlite==0.20.0",
  "redis==5.2.1",
  "celery==5.4.0",
  "loguru==0.7.2",
  "requests==2.32.3",
  "python-jose==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "bcrypt==4.0.1",
  "cryptography==44.0.0",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "email-validator==2.2.0",
  "python-multipart==0.0.20",
  "loguru>=0.7.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "httpx==0.28.1",
  "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


